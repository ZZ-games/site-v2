<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI · ZZ Games</title>
  <script>document.title = "ZZ Classroom";</script>
  <script type="speculationrules">{"prefetch":[{"where":{"selector_matches":".zz-links a, .m-links a, .zz-panel, .topbar .logo, .m-logo"},"eagerness":"moderate"}]}</script>
  <script src="zz-guard.js?v=202611170"></script>
  <link rel="icon" type="image/svg+xml" href="tab/classroom.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="tab/classroom-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="tab/classroom-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="tab/classroom-192.png">
  <meta name="description" content="ZZ AI: chat with AI right on ZZ Games. Free.">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css?v=202611194">
  <link rel="stylesheet" href="zz-fx.css?v=202611191">
  <link rel="expect" href="#fxReady" blocking="render">
</head>
<body class="ai-page">
  <header class="topbar">
    <a href="index.html" class="logo"><img src="logo-flat.png?v=2" alt="ZZ Games"></a>
    <span class="fx-pill" aria-hidden="true"></span>
    <nav class="zz-links" aria-label="Main">
      <a href="games.html">Games</a>
      <a href="music.html">Music</a>
      <a href="watch.html?type=movie&id=popular">Movies</a>
      <a href="watch.html?type=tv&id=popular">TV</a>
      <a href="ai.html" class="on">AI</a>
    </nav>
    <i id="fxReady" hidden></i>
    <a id="requestLink" class="btn ghost hide-sm" href="request.html">Request a game</a>
  </header>

  <main class="ai">
    <section class="page-hero ai-hero"><h1>AI</h1></section>

    <div class="chips" id="chips">
      <button type="button" data-q="Suggest a fun game for me to play next">Suggest a game</button>
      <button type="button" data-q="Give me tips to get better at Slope">Tips for Slope</button>
      <button type="button" data-q="Tell me a short, clean joke">Tell me a joke</button>
      <button type="button" data-q="Explain Geometry Dash Lite like I'm five">Explain GD Lite simply</button>
      <button type="button" data-q="Plan a 30-minute break with games and music">Plan my break</button>
      <button type="button" id="clear" title="Start a new chat">↺ New chat</button>
    </div>

    <div id="chat" aria-live="polite">
      <div class="chat-empty" id="chatEmpty">
        <svg aria-hidden="true" width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 6c1.2 9.5 5.5 13.8 15 15-9.5 1.2-13.8 5.5-15 15-1.2-9.5-5.5-13.8-15-15 9.5-1.2 13.8-5.5 15-15z"/><path d="M37 30c.5 3.8 2.2 5.5 6 6-3.8.5-5.5 2.2-6 6-.5-3.8-2.2-5.5-6-6 3.8-.5 5.5-2.2 6-6z"/></svg>
        Pick a suggestion above, or type below to start.
      </div>
    </div>

    <form class="composer" id="ask">
      <label class="sr-only" for="q">Message AI</label>
      <input id="q" type="text" placeholder="Ask anything…" autocomplete="off" maxlength="4000">
      <button id="send" class="btn" type="submit">Send</button>
    </form>

    <p class="ai-foot">AI can make mistakes, so double-check anything important.</p>
  </main>

  <script>
    (() => {
      const chat = document.getElementById("chat");
      const form = document.getElementById("ask");
      const input = document.getElementById("q");
      const sendBtn = document.getElementById("send");

      // Pollinations: free, and visitors never sign in. Optional: paste a free *publishable* key (starts
      // with pk_, made at https://enter.pollinations.ai) for higher limits. Publishable keys are made to
      // sit in public website code. Without one, the free no-key service is used (slower when busy).
      const AI_KEY = "";
      // GPT-5 Mini answers; if it's busy or unavailable the next model takes over.
      const MODELS = ["openai", "claude-fast", "gemini-fast", "mistral"];
      const SYSTEM = "You are ZZ AI, the friendly assistant on the ZZ Games site (free browser games, music, movies and TV). Be concise, casual and fun. When suggesting games, pick ones on the site such as Slope, Retro Bowl, Minecraft, Geometry Dash Lite, Drift Boss, Subway Surfers, PolyTrack, Drive Mad or Paper.io 2.";
      let history = [{ role: "system", content: SYSTEM }];
      let busy = false;

      const nearBottom = () => chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
      const stick = () => { if (nearBottom()) chat.scrollTop = chat.scrollHeight; };

      function bubble(role, text) {
        const el = document.createElement("div");
        el.className = "msg " + role;
        if (text != null) el.textContent = text;
        const empty = document.getElementById("chatEmpty");
        if (empty) empty.remove();
        chat.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
        return el;
      }

      function reset() {
        history = [{ role: "system", content: SYSTEM }];
        chat.replaceChildren();
        busy = false; sendBtn.disabled = false;
        input.focus();
      }

      // Chat runs straight from the browser (works on GitHub Pages, no server, no sign-in).
      // Replies stream in word by word (OpenAI-style server-sent events).
      async function aiChat(messages, model, onText) {
        const url = AI_KEY ? "https://gen.pollinations.ai/v1/chat/completions" : "https://text.pollinations.ai/openai";
        const headers = { "Content-Type": "application/json" };
        if (AI_KEY) headers.Authorization = "Bearer " + AI_KEY;
        const r = await fetch(url, { method: "POST", headers, body: JSON.stringify({ model, messages, stream: true }), signal: AbortSignal.timeout(60000) });
        if (!r.ok) throw new Error(r.status === 429 ? "429 busy" : "AI error " + r.status);
        const type = r.headers.get("content-type") || "";
        if (!type.includes("event-stream") || !r.body) {
          // some answers come back in one piece instead of streaming
          const raw = await r.text();
          let out = raw;
          try { const j = JSON.parse(raw); out = j.choices?.[0]?.message?.content ?? raw; } catch {}
          if (out) onText(out);
          return out;
        }
        const reader = r.body.getReader(), dec = new TextDecoder();
        let buf = "", got = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n"); buf = lines.pop();
          for (const line of lines) {
            const d = line.trim();
            if (!d.startsWith("data:")) continue;
            const payload = d.slice(5).trim();
            if (payload === "[DONE]") return got;
            try {
              const j = JSON.parse(payload);
              if (j.error) throw new Error(j.error.message || "AI error");
              const t = j.choices?.[0]?.delta?.content ?? j.choices?.[0]?.message?.content ?? "";
              if (t) { got += t; onText(got); }
            } catch (e) { if (e.message && e.message !== "Unexpected end of JSON input" && !(e instanceof SyntaxError)) throw e; }
          }
        }
        return got;
      }

      async function send(raw) {
        if (busy) return;
        const text = String(raw ?? input.value).trim();
        if (!text) return;
        input.value = "";
        bubble("user", text);
        history.push({ role: "user", content: text });

        busy = true;
        sendBtn.disabled = true;
        const ai = bubble("ai", "");
        ai.classList.add("thinking");
        ai.innerHTML = "<i></i><i></i><i></i>";
        try {
          // the typing dots go away as soon as the first words arrive
          const onText = (g) => { ai.classList.remove("thinking"); ai.textContent = g; stick(); };
          let got = "", lastErr = null;
          for (const model of MODELS) {
            try { got = await aiChat(history, model, onText); lastErr = null; break; }
            catch (err) { lastErr = err; if (ai.textContent && !ai.classList.contains("thinking")) break; }   // stop if words already came in
          }
          if (lastErr) throw lastErr;
          if (!got.trim()) { ai.textContent = "(empty response — try again)"; ai.classList.add("err"); }
          else history.push({ role: "assistant", content: got });
        } catch (err) {
          ai.classList.remove("thinking");
          ai.textContent = "";
          ai.classList.add("err");
          const msg = String(err?.message || err || "Unknown error");
          ai.textContent = /429|rate|limit|busy/i.test(msg)
            ? "The AI is busy right now. Wait a few seconds and try again."
            : /fetch|network|timeout|abort|error 5\d\d/i.test(msg)
              ? "The AI couldn't be reached. Check your connection and try again."
              : "Something went wrong: " + msg;
        } finally {
          ai.classList.remove("thinking");
          busy = false;
          sendBtn.disabled = false;
          stick();
          input.focus();
        }
      }

      form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      });
      document.getElementById("chips").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.id === "clear") { reset(); return; }
        send(b.dataset.q);
      });
    })();
  </script>
  <script src="zz-fx.js?v=202611191"></script>
</body>
</html>
