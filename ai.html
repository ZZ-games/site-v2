<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI · ZZ Games</title>
  <script>document.title = "ZZ Classroom";</script>
  <script src="zz-guard.js?v=202611170"></script>
  <link rel="icon" type="image/svg+xml" href="images/tab/classroom.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="images/tab/classroom-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="images/tab/classroom-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/tab/classroom-192.png">
  <meta name="description" content="ZZ AI: chat with AI right on ZZ Games. Free.">
  <link rel="stylesheet" href="fonts/fonts.css">
  <script src="https://js.puter.com/v2/"></script>
  <link rel="stylesheet" href="style.css?v=202611170">
  <style>
    main.ai { max-width: 880px; margin: 0 auto; padding: 30px 18px 32px; }
    .ai-hero { text-align: center; margin: 6px 0 20px; }
    .ai-hero h1 { font-family: "Russo One", sans-serif; font-weight: 400; font-size: clamp(2rem, 5vw, 2.7rem); margin: 0; color: var(--accent-2); filter: drop-shadow(0 0 22px #1f6bffaa); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
    .chips button { background: #0a1142; color: #c3cdf0; border: 1px solid #1f6bff44; border-radius: 999px; padding: 8px 14px; font: 600 .82rem Inter, sans-serif; cursor: pointer; transition: border-color .15s, color .15s; }
    .chips button:hover { border-color: var(--accent); color: #fff; }

    #chat { display: flex; flex-direction: column; gap: 12px; min-height: 40vh; }
    .msg { max-width: 78%; padding: 12px 16px; border-radius: 16px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; box-shadow: 0 6px 24px #1f6bff55; }
    .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid #1f6bff33; border-bottom-left-radius: 6px; }
    .msg.err { background: #230a12; border-color: #d4251a55; color: #ffb9b0; }
    .msg.thinking::after { content: "···"; letter-spacing: 3px; display: inline-block; animation: ai-blink 1s infinite; }
    @keyframes ai-blink { 50% { opacity: .25; } }

    .composer { position: sticky; bottom: 14px; display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 10px 10px 10px 16px; background: rgba(1, 3, 31, .88); backdrop-filter: blur(12px); border: 1px solid #1f6bff44; border-radius: 999px; box-shadow: 0 18px 50px #000a; }
    .composer input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text); font: 500 .95rem Inter, sans-serif; outline: none; }
    .composer input::placeholder { color: var(--muted); }
    .composer .btn { border-radius: 999px; padding: 10px 18px; flex-shrink: 0; }
    .composer .btn:disabled { opacity: .5; cursor: default; transform: none; }

    .ai-foot { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 16px; }
    @media (max-width: 560px) { .msg { max-width: 92%; } }
  </style>
  <link rel="stylesheet" href="zz-fx.css?v=202611176">
  <link rel="expect" href="#fxReady" blocking="render">
</head>
<body class="ai-page">
  <header class="topbar">
    <a href="index.html" class="logo"><img src="images/logo-flat.png?v=2" alt="ZZ Games"></a>
    <span class="fx-pill" aria-hidden="true"></span>
    <nav class="zz-links" aria-label="Main">
      <a href="games.html">Games</a>
      <a href="music.html">Music</a>
      <a href="watch.html?type=movie&id=popular">Movies</a>
      <a href="watch.html?type=tv&id=popular">TV</a>
      <a href="ai.html" class="on">AI</a>
    </nav>
    <i id="fxReady" hidden></i>
    <a id="requestLink" class="btn ghost hide-sm" href="request.html">Request a game</a>
  </header>

  <main class="ai">
    <section class="ai-hero"><h1>AI</h1></section>

    <div class="chips" id="chips">
      <button type="button" data-q="Suggest a fun game for me to play next">Suggest a game</button>
      <button type="button" data-q="Give me tips to get better at Slope">Tips for Slope</button>
      <button type="button" data-q="Tell me a short, clean joke">Tell me a joke</button>
      <button type="button" data-q="Explain Geometry Dash Lite like I'm five">Explain GD Lite simply</button>
      <button type="button" data-q="Plan a 30-minute break with games and music">Plan my break</button>
      <button type="button" id="clear" title="Start a new chat">↺ New chat</button>
    </div>

    <div id="chat" aria-live="polite"></div>

    <form class="composer" id="ask">
      <label class="sr-only" for="q">Message AI</label>
      <input id="q" type="text" placeholder="Ask anything…" autocomplete="off" maxlength="4000">
      <button id="send" class="btn" type="submit">Send</button>
    </form>

    <p class="ai-foot">AI by Puter. It can make mistakes, so double-check anything important.</p>
  </main>

  <script>
    (() => {
      const chat = document.getElementById("chat");
      const form = document.getElementById("ask");
      const input = document.getElementById("q");
      const sendBtn = document.getElementById("send");

      const MODEL = "gpt-5.4-nano"; // fast; any Puter model name works here
      const SYSTEM = "You are ZZ AI, the friendly assistant on the ZZ Games site (free browser games, music, movies and TV). Be concise, casual and fun. When suggesting games, pick ones on the site such as Slope, Retro Bowl, Minecraft, Geometry Dash Lite, Drift Boss, Subway Surfers, PolyTrack, Drive Mad or Paper.io 2.";
      let history = [{ role: "system", content: SYSTEM }];
      let busy = false;

      const nearBottom = () => chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
      const stick = () => { if (nearBottom()) chat.scrollTop = chat.scrollHeight; };

      function bubble(role, text) {
        const el = document.createElement("div");
        el.className = "msg " + role;
        if (text != null) el.textContent = text;
        chat.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
        return el;
      }

      function reset() {
        history = [{ role: "system", content: SYSTEM }];
        chat.replaceChildren();
        input.focus();
      }

      // Chat runs through Puter.js right in the browser, so it works on GitHub Pages (no server needed).
      async function puterChat(messages, model, onText) {
        if (!window.puter || !puter.ai) throw new Error("The AI couldn't load. Check your connection and refresh.");
        const resp = await puter.ai.chat(messages, false, { model, stream: true });
        let got = "";
        for await (const part of resp) {
          if (part?.type === "error") throw new Error(part.message || "AI error");
          const t = part?.type === "text" ? part.text : (typeof part?.text === "string" && !part.type ? part.text : "");
          if (t) { got += t; onText(got); }
        }
        return got;
      }

      async function send(raw) {
        if (busy) return;
        const text = String(raw ?? input.value).trim();
        if (!text) return;
        input.value = "";
        bubble("user", text);
        history.push({ role: "user", content: text });

        busy = true;
        sendBtn.disabled = true;
        const ai = bubble("ai", "");
        ai.classList.add("thinking");
        try {
          const onText = (g) => { ai.textContent = g; stick(); };
          const got = await puterChat(history, MODEL, onText);
          if (!got.trim()) { ai.textContent = "(empty response — try again)"; ai.classList.add("err"); }
          else history.push({ role: "assistant", content: got });
        } catch (err) {
          ai.classList.remove("thinking");
          ai.classList.add("err");
          const msg = String(err?.message || err || "Unknown error");
          ai.textContent = /429|rate|limit|busy/i.test(msg)
            ? "The AI just answered someone — wait about a minute and try again."
            : "Something went wrong: " + msg;
        } finally {
          ai.classList.remove("thinking");
          busy = false;
          sendBtn.disabled = false;
          stick();
          input.focus();
        }
      }

      form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      });
      document.getElementById("chips").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.id === "clear") { reset(); return; }
        send(b.dataset.q);
      });
    })();
  </script>
  <script src="zz-fx.js?v=202611176"></script>
</body>
</html>
